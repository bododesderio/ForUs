worker_processes auto;

events {
    worker_connections 1024;
}

http {
    access_log /dev/stdout;
    error_log  /dev/stderr;

    upstream django_api  { server django:8000; }
    upstream fastapi_rt  { server fastapi:8000; }

    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    server {
        listen 80;
        client_max_body_size 50m;

        # Data / admin / auth / CRUD / billing → Django (DRF)
        location /api/ {
            proxy_pass http://django_api;
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Realtime REST → FastAPI
        location /rt/ {
            proxy_pass http://fastapi_rt;
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # WebSockets → FastAPI (upgrade). Prefix match so the exact `/ws` path the
        # client connects to (ws://…/ws?ticket=) is routed, not just `/ws/…`.
        location /ws {
            proxy_pass http://fastapi_rt;
            proxy_http_version 1.1;
            proxy_set_header Upgrade    $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host       $host;
            proxy_read_timeout 3600s;
        }
    }
}

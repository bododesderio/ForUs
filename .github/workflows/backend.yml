name: Backend CI

on:
  push:
    branches: [main, develop]
    paths:
      - 'backend/**'
  pull_request:
    branches: [main]
    paths:
      - 'backend/**'

jobs:
  lint-and-audit:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Security audit
        run: npm audit --audit-level=high
        continue-on-error: true

      - name: Check for secrets in code
        run: |
          if grep -r "BEGIN PRIVATE KEY\|CLOUDINARY_API_SECRET\|STREAM_API_SECRET" --include="*.js" --include="*.ts" .; then
            echo "ERROR: Secrets found in source code"
            exit 1
          fi
          echo "No secrets found in source code"

  docker-build:
    runs-on: ubuntu-latest
    needs: lint-and-audit

    steps:
      - uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t forus-backend ./backend

      - name: Verify image builds successfully
        run: docker images forus-backend

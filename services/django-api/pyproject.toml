[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

# Deps-only install: the service runs from its working dir (manage.py / gunicorn),
# so no source packages are built — avoids setuptools flat-layout auto-discovery.
[tool.setuptools]
py-modules = []

[project]
name = "forus-django-api"
version = "0.1.0"
description = "ForUs data/admin/auth/CRUD/billing API (Django + DRF)"
requires-python = ">=3.12"
dependencies = [
    "Django>=5.0,<5.2",
    "djangorestframework>=3.15",
    "djangorestframework-simplejwt>=5.3",
    "django-cors-headers>=4.4",
    "django-storages>=1.14",
    "boto3>=1.34",
    "bcrypt>=4.1",  # required by the configured bcrypt hasher (Node hash compat, R2)
    "structlog>=24.1",
    "celery>=5.4",
    "redis>=5.0",
    "psycopg[binary]>=3.2",
    "httpx>=0.27",
    "gunicorn>=22.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "pytest-django>=4.8",
    "ruff>=0.5",
]

[tool.ruff]
line-length = 100
target-version = "py312"
# Generated migrations are not hand-authored; don't lint their import order/style.
extend-exclude = ["**/migrations/*"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "DJ"]
# E501: long lines tolerated. DJ001: string columns are deliberately null=True to
# preserve parity with the source (Drizzle) schema's nullable varchar columns —
# Django owns the schema and FastAPI reflects it, so column nullability must match.
ignore = ["E501", "DJ001"]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "forus.settings"
python_files = ["test_*.py"]
addopts = "-q"
